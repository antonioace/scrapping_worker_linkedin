services:
  worker:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    labels:
      - 'traefik.enable=false'
    init: true
    shm_size: 1gb
    stop_grace_period: 30s
    restart: "no"
    volumes:
      - linkedin-data:/data
    networks:
      - web

  login:
    profiles: [login]
    build:
      context: .
      target: login
    init: true
    shm_size: 1gb
    labels:
      - 'traefik.enable=false'
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - linkedin-data:/data
    networks:
      - web

volumes:
  linkedin-data:

networks:
  web:
    external: true
