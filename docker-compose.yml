services:
  worker:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    labels:
      - 'traefik.enable=false'
    init: true
    shm_size: 1gb
    stop_grace_period: 30s
    restart: "no"
    volumes:
      - linkedin-data:/data
      - type: bind
        source: ./linkedin.cookies.json
        target: /run/secrets/linkedin.cookies.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - web

volumes:
  linkedin-data:

networks:
  web:
    external: true
